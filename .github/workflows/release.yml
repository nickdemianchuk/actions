name: release

on:
  workflow_call:
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve app bot identity
        id: app-identity
        run: |
          slug="${{ steps.app-token.outputs.app-slug }}"
          user_id=$(curl -s "https://api.github.com/users/${slug}%5Bbot%5D" | jq -r .id)
          echo "name=${slug}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${slug}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Bootstrap initial version tag
        run: |
          if ! git tag --list | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            git tag 0.0.0
            git push origin 0.0.0
          fi

      - name: Install semantic-release plugins
        run: npm install --no-save semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github

      - name: Create semantic-release config
        run: |
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main"],
            "tagFormat": "${version}",
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              ["@semantic-release/changelog", { "changelogFile": "CHANGELOG.md" }],
              ["@semantic-release/git", { "assets": ["CHANGELOG.md"], "message": "chore: release ${nextRelease.version}" }],
              ["@semantic-release/github", { "successComment": ":tada: This PR is included in version `${nextRelease.version}` :tada:\n\nThe release is available on [GitHub release](${releases[0].url}) :package::rocket:" }]
            ]
          }
          EOF

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app-identity.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.app-identity.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.app-identity.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.app-identity.outputs.email }}
        run: npx semantic-release
